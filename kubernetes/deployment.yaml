apiVersion: apps/v1
kind: Deployment

metadata:
  name: devsecops-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: devsecops-api

  template:
    metadata:
      labels:
        app: devsecops-api

    spec:
      containers:
        - name: api
          image: cloud-native-devsecops-api:dev
          imagePullPolicy: Never

          ports:
            - containerPort: 8000
