replicaCount: 2

image:
  repository: cloud-native-devsecops-api
  tag: dev
  pullPolicy: Never

config:
  logLevel: INFO
  environment: local
  uvicornPort: "8000"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

probes:
  liveness:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  readiness:
    path: /ready
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
